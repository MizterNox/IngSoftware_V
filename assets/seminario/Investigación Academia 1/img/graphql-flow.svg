<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
  <defs>
    <linearGradient id="gqlBg" x1="0" y1="0" x2="640" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140B24"/>
      <stop offset="55%" stop-color="#1B1030"/>
      <stop offset="100%" stop-color="#0B1022"/>
    </linearGradient>
    <linearGradient id="gqlPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E10098"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="okGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="632" height="262" rx="20" fill="url(#gqlBg)" stroke="#F472B6" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Left: Client App -->
  <rect x="24" y="54" width="154" height="162" rx="16" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.6" stroke-width="1.8"/>
  <text x="101" y="84" text-anchor="middle" fill="#F9A8D4" font-family="monospace" font-size="11" font-weight="700">CLIENTE WEB / APP</text>
  <text x="101" y="106" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Red Social</text>
  <rect x="38" y="120" width="126" height="78" rx="10" fill="#1E1B38" stroke="#E10098" stroke-opacity="0.5"/>
  <text x="48" y="140" fill="#F472B6" font-family="monospace" font-size="10.5">query {</text>
  <text x="56" y="156" fill="#E2E8F0" font-family="monospace" font-size="10.5">usuario {</text>
  <text x="64" y="171" fill="#6EE7B7" font-family="monospace" font-size="10.5">nombre, correo</text>
  <text x="48" y="187" fill="#F472B6" font-family="monospace" font-size="10.5">} }</text>

  <!-- Arrow Client -> GraphQL -->
  <path d="M182 115 H248" stroke="url(#gqlPink)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M241 109 L249 115 L241 121" stroke="#F472B6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="215" y="104" text-anchor="middle" fill="#F9A8D4" font-family="monospace" font-size="10">1 Petición</text>

  <!-- Arrow GraphQL -> Client -->
  <path d="M248 156 H182" stroke="url(#okGreen)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M189 150 L181 156 L189 162" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="215" y="174" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">JSON Exacto</text>

  <!-- Center: Single Endpoint -->
  <rect x="254" y="46" width="144" height="178" rx="18" fill="#180D2C" stroke="url(#gqlPink)" stroke-width="2.2"/>
  <polygon points="326,70 350,84 350,112 326,126 302,112 302,84" stroke="#F472B6" stroke-width="2" fill="#E10098" fill-opacity="0.18"/>
  <polygon points="326,70 350,112 302,112" stroke="#F9A8D4" stroke-width="1.4" fill="none"/>
  <text x="326" y="152" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Único Endpoint</text>
  <rect x="274" y="164" width="104" height="26" rx="8" fill="#2E1045"/>
  <text x="326" y="181" text-anchor="middle" fill="#F472B6" font-family="monospace" font-size="11.5" font-weight="700">POST /graphql</text>
  <text x="326" y="208" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10.5">Facebook · API Flexible</text>

  <!-- Right Top: GraphQL Exact Result -->
  <rect x="424" y="34" width="192" height="96" rx="14" fill="#0B2220" stroke="url(#okGreen)" stroke-width="1.8"/>
  <text x="440" y="58" fill="#34D399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">✓ Sin Over-fetching</text>
  <text x="440" y="79" fill="#E2E8F0" font-family="monospace" font-size="10.5">"nombre": "Luz Daniela"</text>
  <text x="440" y="96" fill="#E2E8F0" font-family="monospace" font-size="10.5">"correo": "luz@uni.pe"</text>
  <text x="440" y="116" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10.5">Solo los campos pedidos</text>

  <!-- Right Bottom: REST Contrast -->
  <rect x="424" y="144" width="192" height="94" rx="14" fill="#1E1624" stroke="#FB7185" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="440" y="168" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✕ REST Tradicional</text>
  <text x="440" y="188" fill="#94A3B8" font-family="monospace" font-size="10">GET /api/users/5</text>
  <text x="440" y="206" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Devuelve perfil completo</text>
  <text x="440" y="223" fill="#FB7185" font-family="system-ui, sans-serif" font-size="10.5">(datos extra innecesarios)</text>

  <path d="M398 96 L424 82" stroke="#34D399" stroke-width="2"/>
</svg>
