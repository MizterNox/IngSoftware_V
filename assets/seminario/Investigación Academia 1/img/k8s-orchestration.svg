<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
  <defs>
    <linearGradient id="k8sBg" x1="0" y1="0" x2="640" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081229"/>
      <stop offset="55%" stop-color="#0D1E42"/>
      <stop offset="100%" stop-color="#081022"/>
    </linearGradient>
    <linearGradient id="k8sBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#326CE5"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="632" height="262" rx="20" fill="url(#k8sBg)" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Left: Traffic + Load Balancer -->
  <rect x="22" y="46" width="150" height="178" rx="16" fill="#0B1730" stroke="url(#k8sBlue)" stroke-width="2"/>
  <text x="97" y="74" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="10.5" font-weight="700">TRÁFICO WEB</text>
  <text x="97" y="98" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Balanceador</text>
  <text x="97" y="116" text-anchor="middle" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="14" font-weight="800">de Carga</text>
  <rect x="38" y="134" width="118" height="34" rx="8" fill="#172554"/>
  <text x="97" y="155" text-anchor="middle" fill="#DBEAFE" font-family="monospace" font-size="10.5">Alta Disponibilidad</text>
  <text x="97" y="196" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10.5">Pico: Black Friday</text>

  <!-- Center: Control Plane -->
  <rect x="206" y="46" width="152" height="178" rx="16" fill="#0F1F40" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="282" cy="96" r="24" fill="#326CE5" fill-opacity="0.25" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="282" cy="96" r="9" stroke="#93C5FD" stroke-width="1.8"/>
  <path d="M282 68 V76 M282 116 V124 M254 96 H262 M302 96 H310 M262 76 L268 82 M296 110 L302 116 M302 76 L296 82 M268 110 L262 116" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round"/>
  <text x="282" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Kubernetes (k8s)</text>
  <text x="282" y="167" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11">Auto-escalado +</text>
  <text x="282" y="184" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Auto-recuperación</text>
  <text x="282" y="206" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="10">Control Plane</text>

  <!-- Right: Worker Cluster Pods -->
  <rect x="392" y="32" width="224" height="206" rx="16" fill="#0A162E" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.8"/>
  <text x="504" y="56" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="10.5" font-weight="700">CLÚSTER DE PODS (RÉPLICAS)</text>

  <!-- Pod 1 -->
  <rect x="410" y="70" width="88" height="68" rx="11" fill="#0D2824" stroke="#34D399" stroke-width="1.7"/>
  <text x="454" y="95" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11.5" font-weight="700">Pod Web 01</text>
  <text x="454" y="116" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">● Activo</text>

  <!-- Pod 2 -->
  <rect x="510" y="70" width="88" height="68" rx="11" fill="#0D2824" stroke="#34D399" stroke-width="1.7"/>
  <text x="554" y="95" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11.5" font-weight="700">Pod Web 02</text>
  <text x="554" y="116" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">● Activo</text>

  <!-- Pod 3 Auto-scaled -->
  <rect x="410" y="150" width="88" height="68" rx="11" fill="#172554" stroke="#60A5FA" stroke-width="1.7" stroke-dasharray="4 3"/>
  <text x="454" y="175" text-anchor="middle" fill="#DBEAFE" font-family="monospace" font-size="11" font-weight="700">+ Pod Escala</text>
  <text x="454" y="196" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10">↑ Tráfico alto</text>

  <!-- Pod 4 Self-healed -->
  <rect x="510" y="150" width="88" height="68" rx="11" fill="#1E293B" stroke="#FBBF24" stroke-width="1.7"/>
  <text x="554" y="175" text-anchor="middle" fill="#FEF3C7" font-family="monospace" font-size="11" font-weight="700">↻ Reemplazo</text>
  <text x="554" y="196" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10">Self-healing</text>

  <!-- Connectors -->
  <path d="M172 135 H206" stroke="#60A5FA" stroke-width="2.5"/>
  <path d="M358 135 H392" stroke="#60A5FA" stroke-width="2.5"/>
</svg>
