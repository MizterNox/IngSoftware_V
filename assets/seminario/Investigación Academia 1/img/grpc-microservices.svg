<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
  <defs>
    <linearGradient id="grpcBg" x1="0" y1="0" x2="640" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071926"/>
      <stop offset="55%" stop-color="#0C2336"/>
      <stop offset="100%" stop-color="#081324"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="632" height="262" rx="20" fill="url(#grpcBg)" stroke="#22D3EE" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Left Microservice: Pagos -->
  <rect x="24" y="52" width="166" height="164" rx="16" fill="#0B1628" stroke="url(#cyanGrad)" stroke-width="2"/>
  <rect x="40" y="68" width="64" height="22" rx="6" fill="#083344"/>
  <text x="72" y="83" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10.5" font-weight="700">Python / Go</text>
  <text x="40" y="114" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Microservicio</text>
  <text x="40" y="135" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="15" font-weight="800">de Pagos</text>
  <rect x="40" y="152" width="134" height="46" rx="10" fill="#11223A" stroke="#06B6D4" stroke-opacity="0.4"/>
  <text x="107" y="172" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10.5">Stub Cliente RPC</text>
  <text x="107" y="188" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">DescontarStock()</text>

  <!-- Center Contract: Protocol Buffers -->
  <rect x="236" y="38" width="168" height="192" rx="18" fill="#0E1B30" stroke="url(#violetGrad)" stroke-width="2"/>
  <text x="320" y="64" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="10.5" font-weight="700">GOOGLE · OPEN SOURCE</text>
  <text x="320" y="88" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Protocol Buffers</text>
  <rect x="254" y="102" width="132" height="68" rx="10" fill="#091222" stroke="#818CF8" stroke-opacity="0.45"/>
  <text x="320" y="122" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="10.5">inventario.proto</text>
  <text x="320" y="141" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">10101100 Binario</text>
  <text x="320" y="158" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">HTTP/2 Multiplex</text>
  <rect x="258" y="184" width="124" height="28" rx="8" fill="#083344"/>
  <text x="320" y="202" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">Muy baja latencia</text>

  <!-- Right Microservice: Inventario -->
  <rect x="450" y="52" width="166" height="164" rx="16" fill="#0B1628" stroke="url(#cyanGrad)" stroke-width="2"/>
  <rect x="466" y="68" width="84" height="22" rx="6" fill="#1E1B4B"/>
  <text x="508" y="83" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="10.5" font-weight="700">Node.js / Java</text>
  <text x="466" y="114" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Microservicio</text>
  <text x="466" y="135" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="15" font-weight="800">de Inventario</text>
  <rect x="466" y="152" width="134" height="46" rx="10" fill="#11223A" stroke="#818CF8" stroke-opacity="0.4"/>
  <text x="533" y="172" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10.5">Servidor gRPC</text>
  <text x="533" y="188" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">Stock actualizado</text>

  <!-- Bidirectional Fast Arrows -->
  <path d="M190 116 H234" stroke="#22D3EE" stroke-width="2.6"/>
  <path d="M228 110 L235 116 L228 122" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M404 116 H448" stroke="#22D3EE" stroke-width="2.6"/>
  <path d="M442 110 L449 116 L442 122" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/>

  <path d="M448 156 H404" stroke="#34D399" stroke-width="2.4" stroke-dasharray="5 4"/>
  <path d="M234 156 H190" stroke="#34D399" stroke-width="2.4" stroke-dasharray="5 4"/>
</svg>
