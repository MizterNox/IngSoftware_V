<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
  <defs>
    <linearGradient id="wsBg" x1="0" y1="0" x2="640" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061D1B"/>
      <stop offset="55%" stop-color="#0A2926"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="wsGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="632" height="262" rx="20" fill="url(#wsBg)" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Top Contrast: HTTP Request-Response -->
  <rect x="24" y="22" width="592" height="46" rx="12" fill="#181826" stroke="#64748B" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="42" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HTTP Tradicional:</text>
  <text x="165" y="50" fill="#CBD5E1" font-family="monospace" font-size="11">Petición → Respuesta → Cierra conexión (sin empuje continuo)</text>

  <!-- Main: WebSockets / Socket.io Full Duplex -->
  <!-- Client Box -->
  <rect x="24" y="88" width="164" height="154" rx="16" fill="#0B1928" stroke="url(#wsGreen)" stroke-width="2"/>
  <text x="106" y="116" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10.5" font-weight="700">CLIENTE NAVEGADOR</text>
  <text x="106" y="140" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800">App Interactiva</text>
  <text x="106" y="168" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">• Chat en vivo</text>
  <text x="106" y="188" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">• Docs colaborativos</text>
  <text x="106" y="208" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">• Tablero financiero</text>

  <!-- Persistent Tunnel -->
  <rect x="206" y="114" width="228" height="102" rx="18" fill="#082F29" stroke="#34D399" stroke-width="2"/>
  <text x="320" y="138" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700">CANAL ABIERTO CONTINUO</text>

  <path d="M226 158 H414" stroke="#34D399" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M406 152 L414 158 L406 164" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>

  <path d="M414 182 H226" stroke="#22D3EE" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M234 176 L226 182 L234 188" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round"/>

  <text x="320" y="204" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">ws:// · Socket.io Bidireccional</text>

  <!-- Server Box -->
  <rect x="452" y="88" width="164" height="154" rx="16" fill="#0B1928" stroke="url(#wsGreen)" stroke-width="2"/>
  <text x="534" y="116" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10.5" font-weight="700">SERVIDOR NODE / WS</text>
  <text x="534" y="140" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800">Motor Socket.io</text>
  <rect x="470" y="156" width="128" height="64" rx="10" fill="#07121E" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="534" y="178" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10.5">io.on("connection")</text>
  <text x="534" y="198" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10.5">socket.emit(...)</text>
</svg>
