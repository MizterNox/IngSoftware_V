<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" fill="none">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="640" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D152C" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#111C38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090F20" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="250" y1="160" x2="390" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gqlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E10098"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="grpcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#326CE5"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="dcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2496ED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="wsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base container -->
  <rect x="6" y="6" width="628" height="448" rx="26" fill="url(#bgCard)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="6" y="6" width="628" height="448" rx="26" fill="url(#grid)"/>

  <!-- Ambient glow & orbital rings -->
  <circle cx="320" cy="240" r="185" fill="url(#centerGlow)"/>
  <circle cx="320" cy="240" r="158" stroke="#64748B" stroke-opacity="0.22" stroke-dasharray="5 7" stroke-width="1.3"/>
  <circle cx="320" cy="240" r="108" stroke="#818CF8" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Connection conduits -->
  <path d="M168 122 L274 205" stroke="url(#gqlGrad)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M472 122 L366 205" stroke="url(#grpcGrad)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M162 344 L272 272" stroke="url(#k8sGrad)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M478 344 L368 272" stroke="url(#dcGrad)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M320 96 L320 182" stroke="url(#wsGrad)" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- Central Core Hub -->
  <rect x="242" y="184" width="156" height="112" rx="22" fill="#0F172A" stroke="url(#coreGrad)" stroke-width="2.4"/>
  <rect x="252" y="194" width="136" height="92" rx="16" fill="url(#coreGrad)" fill-opacity="0.14"/>
  <text x="320" y="226" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ARQUITECTURA</text>
  <text x="320" y="250" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">FULLSTACK</text>
  <text x="320" y="272" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="11" font-weight="600">APIs · Cloud · Real-Time</text>

  <!-- Node 5 Top Center: WebSockets / Socket.io -->
  <g transform="translate(222, 24)">
    <rect width="196" height="72" rx="16" fill="#0B1629" stroke="url(#wsGrad)" stroke-width="2"/>
    <circle cx="34" cy="36" r="18" fill="url(#wsGrad)" fill-opacity="0.18"/>
    <path d="M26 32 H42 M37 27 L42 32 L37 37 M42 41 H26 M31 36 L26 41 L31 46" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="33" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">WebSockets</text>
    <text x="62" y="51" fill="#6EE7B7" font-family="monospace" font-size="11">Socket.io · Tiempo Real</text>
  </g>

  <!-- Node 1 Top Left: GraphQL -->
  <g transform="translate(28, 76)">
    <rect width="176" height="78" rx="16" fill="#0B1629" stroke="url(#gqlGrad)" stroke-width="2"/>
    <circle cx="34" cy="39" r="18" fill="url(#gqlGrad)" fill-opacity="0.18"/>
    <polygon points="34,24 47,31.5 47,46.5 34,54 21,46.5 21,31.5" stroke="#F472B6" stroke-width="1.8" fill="none"/>
    <polygon points="34,24 47,46.5 21,46.5" stroke="#F472B6" stroke-width="1.3" fill="none"/>
    <text x="61" y="35" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800">01 · GraphQL</text>
    <text x="61" y="54" fill="#F9A8D4" font-family="monospace" font-size="11">Endpoint único</text>
  </g>

  <!-- Node 2 Top Right: gRPC -->
  <g transform="translate(436, 76)">
    <rect width="176" height="78" rx="16" fill="#0B1629" stroke="url(#grpcGrad)" stroke-width="2"/>
    <circle cx="34" cy="39" r="18" fill="url(#grpcGrad)" fill-opacity="0.18"/>
    <path d="M25 33 L34 27 L43 33 L43 45 L34 51 L25 45 Z" stroke="#22D3EE" stroke-width="1.8" fill="none"/>
    <circle cx="34" cy="39" r="4" fill="#22D3EE"/>
    <text x="61" y="35" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800">02 · gRPC</text>
    <text x="61" y="54" fill="#67E8F9" font-family="monospace" font-size="11">Protocol Buffers</text>
  </g>

  <!-- Node 3 Bottom Left: Kubernetes -->
  <g transform="translate(28, 322)">
    <rect width="186" height="82" rx="16" fill="#0B1629" stroke="url(#k8sGrad)" stroke-width="2"/>
    <circle cx="35" cy="41" r="18" fill="url(#k8sGrad)" fill-opacity="0.2"/>
    <circle cx="35" cy="41" r="10" stroke="#60A5FA" stroke-width="1.8" fill="none"/>
    <path d="M35 26 V31 M35 51 V56 M20 41 H25 M45 41 H50 M24 30 L28 34 M42 48 L46 52 M46 30 L42 34 M28 48 L24 52" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/>
    <text x="62" y="37" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="800">03 · Kubernetes</text>
    <text x="62" y="56" fill="#93C5FD" font-family="monospace" font-size="11">Orquestación k8s</text>
  </g>

  <!-- Node 4 Bottom Right: Docker Compose -->
  <g transform="translate(426, 322)">
    <rect width="186" height="82" rx="16" fill="#0B1629" stroke="url(#dcGrad)" stroke-width="2"/>
    <circle cx="35" cy="41" r="18" fill="url(#dcGrad)" fill-opacity="0.2"/>
    <rect x="24" y="35" width="9" height="8" rx="1.5" stroke="#38BDF8" stroke-width="1.7"/>
    <rect x="35" y="35" width="9" height="8" rx="1.5" stroke="#38BDF8" stroke-width="1.7"/>
    <rect x="29.5" y="25" width="9" height="8" rx="1.5" stroke="#38BDF8" stroke-width="1.7"/>
    <path d="M22 47 H48" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="61" y="37" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">04 · Compose</text>
    <text x="61" y="56" fill="#7DD3FC" font-family="monospace" font-size="11">docker-compose.yml</text>
  </g>

  <!-- Bottom technical telemetry strip -->
  <text x="320" y="434" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1.6">DESARROLLO DE APIs · MICROSERVICIOS · CONTENEDORES · TIEMPO REAL</text>
</svg>
