<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1226"/><stop offset="1" stop-color="#142a5a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#b6001a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec8ff"/><stop offset="1" stop-color="#0050a8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e676"/><stop offset="1" stop-color="#007a3a"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd600"/><stop offset="1" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="28" fill="url(#bg)"/>
  <!-- grid -->
  <g opacity="0.12">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800" stroke="white" stroke-width="1"/>
    <path d="M80 0 V520 M160 0 V520 M240 0 V520 M320 0 V520 M400 0 V520 M480 0 V520 M560 0 V520 M640 0 V520 M720 0 V520" stroke="white" stroke-width="1"/>
  </g>
  <!-- isometric blocks -->
  <!-- Center platform -->
  <g transform="translate(400,260)">
    <path d="M -140 0 L 0 -80 L 140 0 L 0 80 Z" fill="#1a2a4a" stroke="rgba(255,255,255,.15)" stroke-width="2"/>
    <path d="M -140 0 L -140 28 L 0 108 L 0 80 Z" fill="#0f1e38"/>
    <path d="M 140 0 L 140 28 L 0 108 L 0 80 Z" fill="#0c1830"/>
    <!-- Blocks on platform -->
    <!-- Red block -->
    <g transform="translate(-70,-10)">
      <path d="M -36 0 L 0 -21 L 36 0 L 0 21 Z" fill="url(#red)"/>
      <path d="M -36 0 L -36 28 L 0 49 L 0 21 Z" fill="#7a0a14"/>
      <path d="M 36 0 L 36 28 L 0 49 L 0 21 Z" fill="#4d060c"/>
      <circle cx="0" cy="-9" r="5" fill="white" opacity="0.95"/>
      <circle cx="-12" cy="-4" r="3" fill="white" opacity="0.7"/>
      <circle cx="12" cy="-4" r="3" fill="white" opacity="0.7"/>
    </g>
    <!-- Blue block -->
    <g transform="translate(70,-10)">
      <path d="M -36 0 L 0 -21 L 36 0 L 0 21 Z" fill="url(#blue)"/>
      <path d="M -36 0 L -36 28 L 0 49 L 0 21 Z" fill="#003a6b"/>
      <path d="M 36 0 L 36 28 L 0 49 L 0 21 Z" fill="#001e38"/>
      <circle cx="0" cy="-9" r="5" fill="white" opacity="0.95"/>
    </g>
    <!-- Green block -->
    <g transform="translate(0,-50)">
      <path d="M -42 0 L 0 -24 L 42 0 L 0 24 Z" fill="url(#green)"/>
      <path d="M -42 0 L -42 34 L 0 58 L 0 24 Z" fill="#004d26"/>
      <path d="M 42 0 L 42 34 L 0 58 L 0 24 Z" fill="#002d17"/>
      <circle cx="0" cy="-10" r="6" fill="white"/>
    </g>
    <!-- Yellow spawn -->
    <g transform="translate(0,40)">
      <path d="M -30 0 L 0 -17 L 30 0 L 0 17 Z" fill="url(#yellow)"/>
      <path d="M -30 0 L -30 14 L 0 31 L 0 17 Z" fill="#8a5a00"/>
      <path d="M 30 0 L 30 14 L 0 31 L 0 17 Z" fill="#5a3c00"/>
      <path d="M 0 -17 L 0 31" stroke="white" stroke-width="2" opacity="0.9" stroke-dasharray="6 6"/>
    </g>
  </g>
  <!-- Floating UI cards -->
  <g transform="translate(110,80)">
    <rect x="0" y="0" width="170" height="92" rx="14" fill="white" opacity="0.96"/>
    <rect x="14" y="14" width="42" height="42" rx="10" fill="#ff2d55"/>
    <text x="35" y="40" fill="white" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">▶</text>
    <text x="68" y="26" fill="#0a1226" font-family="sans-serif" font-size="11" font-weight="800">Roblox Studio</text>
    <text x="68" y="40" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">Build · Script · Test</text>
    <rect x="68" y="50" width="88" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="68" y="60" width="66" height="6" rx="3" fill="#e2e8f0"/>
  </g>
  <g transform="translate(520,90)">
    <rect x="0" y="0" width="170" height="88" rx="14" fill="white" opacity="0.96"/>
    <rect x="14" y="14" width="42" height="42" rx="10" fill="#0ea5e9"/>
    <text x="35" y="41" fill="white" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">{ }</text>
    <text x="68" y="26" fill="#0a1226" font-family="sans-serif" font-size="11" font-weight="800">Luau Script</text>
    <text x="68" y="40" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">Logic &amp; Events</text>
    <rect x="68" y="50" width="80" height="22" rx="7" fill="#0a1226"/>
    <text x="108" y="65" fill="#22d3ee" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">game.Workspace</text>
  </g>
  <g transform="translate(120,380)">
    <rect x="0" y="0" width="180" height="82" rx="14" fill="white" opacity="0.96"/>
    <rect x="14" y="14" width="42" height="42" rx="10" fill="#10b981"/>
    <text x="35" y="41" fill="white" font-family="sans-serif" font-size="16" text-anchor="middle">◧</text>
    <text x="68" y="26" fill="#0a1226" font-family="sans-serif" font-size="11" font-weight="800">Workspace</text>
    <text x="68" y="40" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">Parts · Models · Terrain</text>
    <g transform="translate(68,52)">
      <rect x="0" y="0" width="22" height="14" rx="4" fill="#fee2e2"/><rect x="28" y="0" width="22" height="14" rx="4" fill="#dbeafe"/><rect x="56" y="0" width="22" height="14" rx="4" fill="#d1fae5"/>
    </g>
  </g>
  <g transform="translate(510,360)">
    <rect x="0" y="0" width="180" height="82" rx="14" fill="white" opacity="0.96"/>
    <rect x="14" y="14" width="42" height="42" rx="10" fill="#f59e0b"/>
    <text x="35" y="41" fill="white" font-family="sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="68" y="26" fill="#0a1226" font-family="sans-serif" font-size="11" font-weight="800">Toolbox &amp; Assets</text>
    <text x="68" y="40" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">Marketplace · Plugins</text>
    <g transform="translate(68,52)">
      <circle cx="7" cy="7" r="7" fill="#ffd600"/><circle cx="23" cy="7" r="7" fill="#00e676"/><circle cx="39" cy="7" r="7" fill="#ff2d55"/>
    </g>
  </g>
  <!-- connecting dashed lines -->
  <g opacity="0.35" stroke="white" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <path d="M195 126 L 300 210"/><path d="M605 134 L 480 210"/><path d="M210 380 L 285 308"/><path d="M600 360 L 490 305"/>
  </g>
</svg>
