<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" rx="20" fill="#0a1226"/>
  <g transform="translate(300,200)">
    <rect x="-220" y="-110" width="440" height="220" rx="20" fill="white"/>
    <!-- coin -->
    <g transform="translate(-110,0)">
      <circle cx="0" cy="0" r="58" fill="#ffb700" stroke="#0a1226" stroke-width="4"/>
      <circle cx="0" cy="0" r="44" fill="#ffd600" stroke="rgba(0,0,0,.12)"/>
      <text x="0" y="10" fill="#0a1226" font-size="32" font-weight="900" text-anchor="middle">R$</text>
      <text x="0" y="36" fill="#0a1226" font-size="10" font-weight="800" text-anchor="middle">ROBUX</text>
    </g>
    <!-- arrow -->
    <g transform="translate(0,0)"><rect x="-18" y="-14" width="36" height="28" rx="8" fill="#0a1226"/><text x="0" y="6" fill="white" font-size="16" font-weight="800" text-anchor="middle">→</text></g>
    <!-- shop items -->
    <g transform="translate(110,0)">
      <rect x="-70" y="-60" width="140" height="70" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="0" y="-38" fill="#0a1226" font-size="11" font-weight="900" text-anchor="middle">Game Pass</text>
      <text x="0" y="-20" fill="#64748b" font-size="9" font-weight="700" text-anchor="middle">VIP Access</text>
      <rect x="-40" y="-6" width="80" height="22" rx="11" fill="#7c3aed"/><text x="0" y="9" fill="white" font-size="10" font-weight="800" text-anchor="middle">R$ 99</text>
      <rect x="-70" y="22" width="140" height="44" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="0" y="40" fill="#065f46" font-size="10" font-weight="800" text-anchor="middle">+ Coins x2</text>
      <text x="0" y="54" fill="#047857" font-size="8" font-weight="700" text-anchor="middle">Dev Product</text>
    </g>
  </g>
  <text x="300" y="365" fill="white" opacity="0.6" font-size="9" font-weight="700" text-anchor="middle">Monetization — Game Pass · Developer Product · Premium</text>
