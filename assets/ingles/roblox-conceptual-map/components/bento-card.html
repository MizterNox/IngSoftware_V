<!-- Ejemplo de componente Bento Card modularizado -->
<!-- Uso: copiar este bloque en index.html y reemplazar variables {{ }} -->
<article class="bento-card glass" data-category="{{category}}" data-search="{{keywords}}">
  <div class="glow" style="--glow: {{glow}}"></div>
  <div class="p-5">
    <div class="flex items-start justify-between gap-3">
      <span class="badge">{{badge}}</span>
      <span class="h-9 w-9 grid place-items-center rounded-xl bg-white text-slate-900 text-lg">{{icon}}</span>
    </div>
    <h3 class="font-display mt-4 text-lg font-extrabold leading-tight">{{title}}</h3>
    <p class="mt-2 text-sm leading-relaxed text-white/70">{{desc}}</p>
    <div class="mt-4 flex flex-wrap gap-1.5">{{tags}}</div>
  </div>
  <div class="mt-auto flex items-center justify-between border-t border-white/10 bg-white/[.06] px-5 py-3">
    <span class="text-[10px] font-black uppercase tracking-[0.14em] text-white/60">{{meta}}</span>
    <span class="inline-flex items-center gap-1 text-xs font-extrabold text-white">Explore <span aria-hidden="true">→</span></span>
  </div>
</article>
